<style>
:root{
  /* Marca Fundación Alas para Soñar */
  --navy:#2c4a78; --navy-d:#1f365a; --gold:#d6b358; --gold-l:#ecd391;
  --bg:#f5f8fc; --card:#ffffff; --ink:#1f2d44; --muted:#5b6b82; --line:#dbe3ee;
  --pri:#2c4a78; --pri-ink:#ffffff; --pri-soft:#e9f0fa;
  --amber:#fdf1cc; --amber-ink:#7a5600; --red:#fde3d9; --red-ink:#a33a17;
  --green:#daf2f3; --green-ink:#0f5f63; --empty:#eef2f7; --wkend:#f5f2fb; --today:#fff6d9;
  --lav:#9b87c6; --mustard:#f2c14e; --aqua:#6cc3c6; --coral:#ef8f6e;
  --hd:'Fredoka','Nunito',system-ui,sans-serif; --serif:'Lora',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --navy:#13233d; --navy-d:#0d182b; --bg:#0f1a2b; --card:#172438; --ink:#e8eef7; --muted:#9fb0c8; --line:#2a3a55;
    --pri:#d6b358; --pri-ink:#1b1608; --pri-soft:#1f3150;
    --amber:#4a3b0f; --amber-ink:#ffe29a; --red:#4d2216; --red-ink:#ffc2ad;
    --green:#12393b; --green-ink:#a8ecef; --empty:#1d2a40; --wkend:#1b2438; --today:#3a3214; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
header h1{font-family:var(--hd);font-weight:600;font-size:1.15rem;margin:0;letter-spacing:.2px}
header .org{font-family:var(--serif);font-size:.78rem;color:var(--gold-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo{height:42px;width:42px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
nav button .bd{background:var(--red-ink);color:#fff;border-radius:999px;padding:0 6px;font-size:.65rem;margin-left:2px}
.sync{background:rgba(255,255,255,.14);color:#fff;font-family:inherit;border:0;border-radius:999px;padding:6px 10px;font-size:.8rem;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;min-width:72px;border:0;background:none;color:var(--muted);padding:8px 6px;font-size:.72rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:1.25rem}
nav button.on{color:var(--navy);font-weight:800;box-shadow:inset 0 3px 0 var(--gold)}
@media (prefers-color-scheme: dark){nav button.on{color:var(--gold)}}
h2{font-family:var(--hd);font-weight:600;font-size:1.3rem;margin:6px 0 10px;color:var(--navy)}
@media (prefers-color-scheme: dark){h2{color:var(--gold-l)}}
h3{font-family:var(--hd);font-weight:500;font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(31,54,90,.06);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b,label.b,a.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;text-decoration:none;font-family:inherit;font-weight:600;padding:8px 12px;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.b.p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
button.b.d{color:var(--red-ink);border-color:var(--red-ink)}
button.b:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:110px}
.mnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mnav select{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:700;background:var(--empty)}
.chip.a{background:var(--amber);color:var(--amber-ink)} .chip.r{background:var(--red);color:var(--red-ink)} .chip.g{background:var(--green);color:var(--green-ink)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:.85rem;white-space:nowrap}
thead th{background:var(--pri-soft);position:sticky;top:0}
table.grid td,table.grid th{text-align:center;padding:0;border:1px solid var(--line)}
table.grid thead th{padding:5px 4px;font-size:.78rem}
table.grid thead small{display:block;font-weight:400;color:var(--muted)}
table.grid th.st{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:4px 6px;min-width:66px;font-size:.78rem}
table.grid thead th.st{background:var(--pri-soft);z-index:3}
table.grid tr.we th.st, table.grid tr.we td{background:var(--wkend)}
table.grid tr.td th.st{background:var(--today)}
table.grid tr.wk td, table.grid tr.wk th{border-top:3px solid var(--gold)}
td.c{min-width:70px;max-width:96px;height:38px;cursor:pointer;font-size:.76rem;line-height:1.1;padding:2px 3px;overflow:hidden;text-overflow:ellipsis}
td.c.e{background:var(--empty)!important;color:var(--muted)}
td.c.ch{background:var(--amber)!important;color:var(--amber-ink)}
td.c.al{background:var(--red)!important;color:var(--red-ink);font-weight:600}
td.c s{display:block;font-size:.66rem;opacity:.75}
td.c .w{font-size:.65rem}
td.c:hover{outline:2px solid var(--pri);outline-offset:-2px}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.tot td{font-weight:700;border-top:2px solid var(--line)}
table.data td input{width:72px;padding:4px 6px}
.bad{color:var(--red-ink);font-weight:700}
.ok{color:var(--green-ink)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.li{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:.88rem}
.li.r{border-color:var(--red-ink)}
.av{border-collapse:separate;border-spacing:3px;width:auto}
.av th,.av td{border:0;padding:0;text-align:center;font-size:.75rem}
.tg{width:38px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--empty);color:var(--muted);cursor:pointer;font-weight:700}
.tg.on{background:var(--green);color:var(--green-ink);border-color:var(--aqua)}
.pcard summary{display:flex;justify-content:space-between;align-items:center}
.cands{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.cand{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card);cursor:pointer;font-size:.82rem;color:var(--ink)}
.cand:hover{border-color:var(--pri)}
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:16px}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:9px 4px;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink);font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.pp{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font-size:.86rem}
.pp small{display:block;font-size:.7rem;color:var(--muted)}
.pp.warn small{color:var(--red-ink)}
.pp.sel{border:2px solid var(--pri);background:var(--pri-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label,.fld{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.prop{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.prop.done{opacity:.6}
.prop .q{font-style:italic;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.prop .fs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.warns{margin:6px 0 0;padding-left:18px;font-size:.82rem;color:var(--red-ink)}
.info{margin:6px 0 0;padding-left:18px;font-size:.82rem;color:var(--green-ink)}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:9px;font-size:.88rem;z-index:60;display:none;max-width:90vw}
.banner{background:var(--amber);color:var(--amber-ink);border-left:5px solid var(--mustard);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.legend span{display:inline-block;padding:2px 8px;border-radius:6px;margin-right:4px;font-size:.78rem}
code{background:var(--empty);padding:1px 5px;border-radius:5px}
ol.help li{margin-bottom:6px}
</style>
</head>

<script>
"use strict";
/* ====== CONFIGURACIÓN: completá esto una vez ====== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxFSNG2bPziRzDz-MioEybv-n1l2LdupB7PR0bRmFBMoiGck73Asm6FkYS4jRLSGUGHXg/exec',                          // ← dirección del servidor de Google (termina en /exec)
  ORG: 'Fundación Alas para Soñar'      // ← nombre que aparece arriba
};
/* ============================== utilidades ============================== */
const FR = ['M','T','C','N'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_L = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const p2 = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); };
const addDays = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => (pd(s).getDay()+6)%7;
const mondayOf = s => addDays(s,-dow(s));
const dayNum = s => { const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000); };
const today = () => ymd(new Date());
const monthDays = key => { const [y,m]=key.split('-').map(Number); const n=new Date(y,m,0).getDate(); return Array.from({length:n},(_,i)=>key+'-'+p2(i+1)); };
const shiftMonth = (key,k) => { const [y,m]=key.split('-').map(Number); const d=new Date(y,m-1+k,1,12); return d.getFullYear()+'-'+p2(d.getMonth()+1); };
const monthLabel = key => { const [y,m]=key.split('-').map(Number); return MESES[m-1]+' '+y; };
const fmtD = s => DIAS[dow(s)]+' '+s.slice(8,10)+'/'+s.slice(5,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2600); }
function download(name,text,mime){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ============================== estado ============================== */
const LS='turnosAC_estado_v1', LSG='turnosAC_servidor_v1', LSM='turnosAC_meta_v1';
const DEFAULT_TYPES = {M:{name:'Mañana',start:7,hours:7,slots:3},T:{name:'Tarde',start:14,hours:7,slots:3},C:{name:'Corto',start:18,hours:4,slots:1},N:{name:'Noche',start:21,hours:10,slots:2}};
const emptyState = () => ({v:1,people:[],types:clone(DEFAULT_TYPES),days:{},avail:{},exceptions:[],log:[],sheetHours:{},settings:{},base:null,updated:0});
function readJSON(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function writeJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('No se pudo guardar en este dispositivo'); } }
let S = readJSON(LS,null) || emptyState();
let META = readJSON(LSM,{dirty:false,rev:null,lastSync:null,conflict:false});
let IDX=null, EV=null;
function fixState(st){
  const b=emptyState();
  for(const k in b) if(st[k]===undefined) st[k]=b[k];
  for(const f of FR) if(!st.types[f]) st.types[f]=clone(DEFAULT_TYPES[f]);
  st.people.forEach(p=>{ if(p.max==null)p.max=5; if(p.active==null)p.active=true; if(p.alias==null)p.alias=''; if(p.phone==null)p.phone=''; if(p.pin==null)p.pin=''; });
  if(!st.settings) st.settings={};
  return st;
}
S=fixState(S);
function invalidate(){ IDX=null; EV=null; }
function save(markDirty=true){
  invalidate(); S.updated=Date.now(); writeJSON(LS,S);
  if(markDirty){ META.dirty=true; writeJSON(LSM,META); scheduleAutoPush(); }
  renderSync();
}
const typeDesc = f => { const t=S.types[f]; return p2(t.start)+' a '+p2((t.start+t.hours)%24); };
const personById = id => S.people.find(p=>p.id===id);
const pname = id => id==='VAC'?'Sin cubrir':(personById(id)?.name||'¿?');
const sname = id => { const n=pname(id); const w=n.split(' '); return w.length>1? w[0]+' '+w[1][0]+'.' : n; };
const activePeople = () => S.people.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name));
/* semana base: los días sin carga propia repiten la semana base */
function baseDay(date){
  const b=S.base; if(!b||b.on===false||!b.week||!b.from||date<b.from) return null;
  const w=b.week[dow(date)]; if(!w) return null;
  const o={}; for(const f of FR) o[f]=(w[f]||[]).map(pid=>({p:pid||null,r:null,adj:0,rec:'',note:''})); return o;
}
function forEachDay(days,cb){
  for(const date in days) cb(date,days[date]);
  const b=S.base; if(!b||b.on===false||!b.week||!b.from) return;
  const end=(+today().slice(0,4)+1)+'-12-31';
  for(let d=b.from; d<=end; d=addDays(d,1)) if(!days[d]){ const v=baseDay(d); if(v) cb(d,v); }
}
function getDay(date,create){
  let d=S.days[date];
  if(!d){ const b=baseDay(date); if(!create) return b; d=S.days[date]=b||{}; }
  if(create) for(const f of FR){ d[f]=d[f]||[]; while(d[f].length<S.types[f].slots) d[f].push({p:null,r:null,adj:0,rec:'',note:''}); }
  return d;
}
const slotAt = (date,f,i,create) => { const d=getDay(date,create); return d&&d[f]?d[f][i]||null:null; };
const who = sl => !sl||sl.r==='VAC' ? null : (sl.r||sl.p||null);
const nSlots = (date,f) => Math.max(S.types[f].slots, (S.days[date]?.[f]||[]).length);

/* ============================== reglas ============================== */
function makeIndex(days){
  const byPid={};
  forEachDay(days,(date,day)=>{
    for(const f of FR){ (day[f]||[]).forEach((sl,i)=>{ const pid=who(sl); if(!pid) return;
      const t=S.types[f]; const hours=t.hours+(+sl.adj||0); const start=dayNum(date)*1440+t.start*60;
      (byPid[pid]=byPid[pid]||[]).push({pid,date,f,i,start,end:start+hours*60,hours,key:date+'|'+f+'|'+i}); }); } });
  for(const p in byPid) byPid[p].sort((a,b)=>a.start-b.start);
  return {byPid};
}
const idx = () => IDX||(IDX=makeIndex(S.days));
function getAvail(key,pid){
  let k=key;
  for(let n=0;n<60;n++){ if(S.avail[k]&&S.avail[k][pid]) return S.avail[k][pid]; k=shiftMonth(k,-1); }
  return ['MTCN','MTCN','MTCN','MTCN','MTCN','MTCN','MTCN'];
}
const exceptionFor = (pid,date) => S.exceptions.find(e=>e.pid===pid&&e.from<=date&&date<=e.to);
function availReason(pid,date,f){
  const ex=exceptionFor(pid,date);
  if(ex) return 'No disponible por fechas'+(ex.note?' ('+ex.note+')':'');
  if(!(getAvail(date.slice(0,7),pid)[dow(date)]||'').includes(f)) return 'No está disponible ese día/turno';
  return null;
}
/* ¿qué problemas tendría asignar a pid en (date,f)? */
function checkAssign(ix,pid,date,f,ignoreKey){
  const reasons=[]; const t=S.types[f];
  const ar=availReason(pid,date,f); if(ar) reasons.push(ar);
  const mine=(ix.byPid[pid]||[]).filter(a=>a.key!==ignoreKey);
  const start=dayNum(date)*1440+t.start*60, end=start+t.hours*60;
  if(mine.some(a=>a.start<end&&a.end>start)) reasons.push('Ya tiene otro turno a esa hora');
  let total=t.hours, s=start, e=end, guard=0;
  for(;guard<20;guard++){ const pr=mine.find(a=>a.end===s); if(!pr) break; total+=pr.hours; s=pr.start; }
  for(;guard<40;guard++){ const nx=mine.find(a=>a.start===e); if(!nx) break; total+=nx.hours; e=nx.end; }
  if(total>12) reasons.push('Quedaría con '+total+' hs seguidas');
  const mon=mondayOf(date), sun=addDays(mon,6);
  const set=new Set(mine.filter(a=>a.date>=mon&&a.date<=sun).map(a=>a.date)); set.add(date);
  const max=personById(pid)?.max??5;
  if(set.size>max) reasons.push('Pasaría a '+set.size+' días esa semana (máx. '+max+')');
  return reasons;
}
/* alertas de todo lo cargado: key -> [motivos] */
function evalAll(){
  if(EV) return EV;
  const res={}; const add=(k,m)=>{ const a=res[k]=res[k]||[]; if(!a.includes(m)) a.push(m); };
  const ix=idx();
  for(const pid in ix.byPid){
    const L=ix.byPid[pid]; const max=personById(pid)?.max??5;
    for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length&&L[j].start<L[i].end;j++){ add(L[i].key,'Tiene dos turnos a la misma hora'); add(L[j].key,'Tiene dos turnos a la misma hora'); }
    let chain=[];
    const flush=()=>{ const tot=chain.reduce((s,a)=>s+a.hours,0); if(chain.length>1&&tot>12) chain.forEach(a=>add(a.key,'Más de 12 hs seguidas ('+tot+' hs)')); };
    for(const a of L){ if(chain.length&&a.start===chain[chain.length-1].end) chain.push(a); else { flush(); chain=[a]; } }
    flush();
    const wk={}; for(const a of L){ const m=mondayOf(a.date); (wk[m]=wk[m]||[]).push(a); }
    for(const m in wk){ const n=new Set(wk[m].map(a=>a.date)).size; if(n>max) wk[m].forEach(a=>add(a.key,'Más de '+max+' días en la semana ('+n+')')); }

}
function monthStats(key){
  const st={}; const g=pid=>st[pid]=st[pid]||{h:0,days:new Set(),fr:{M:0,T:0,C:0,N:0},out:0,cov:0,pend:0};
  const ix=idx();
  for(const pid in ix.byPid) for(const a of ix.byPid[pid]) if(a.date.startsWith(key)){ const s=g(pid); s.h+=a.hours; s.days.add(a.date); s.fr[a.f]++; }
  for(const date in S.days) if(date.startsWith(key)) for(const f of FR) (S.days[date][f]||[]).forEach(sl=>{

function personKeys(){

  for(const p of S.people.filter(p=>p.active)){ const n=norm(p.name); add(n,p.id,true); const first=n.split(' ')[0]; if(first!==n) add(first,p.id,false); (p.alias||'').split(',').forEach(a=>a.trim()&&add(a,p.id,true)); }
  return keys;
}
function findMentions(t){
  const keys=personKeys(); const ks=Object.keys(keys).sort((a,b)=>b.length-a.length); const used=[]; const out=[];
  for(const k of ks){
    const re=new RegExp('(^|[^a-z0-9])('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=$|[^a-z0-9])','g'); let m;
    while((m=re.exec(t))){ const s=m.index+m[1].length, e=s+k.length; if(used.some(([a,b])=>s<b&&e>a)) continue; used.push([s,e]);
      const c=keys[k]; const ids=[...new Set(c.map(x=>x.id))]; const ex=c.find(x=>x.exact);
      out.push({s,e,ids,pick:ex?ex.id:ids[0],amb:ids.length>1}); }
  }
  return out.sort((a,b)=>a.s-b.s);
}

function parseLine(line,sender){

  const m1=t.match(tm);

    for(const k of FR){ const ty=S.types[k]; if(ty.start===a&&((ty.start+ty.hours)%24===b||(k==='N'&&b===7))){ f=k; break; } }
    if(!f&&a===21&&b===1) f='C';

  if(/\bhoy\b/.test(t)) dates.push(base);
  let m; const reD=/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g;
  while((m=reD.exec(t))){ let y=m[3]?+m[3]:+base.slice(0,4); if(y<100) y+=2000; let s=y+'-'+p2(+m[2])+'-'+p2(+m[1]); if(!m[3]&&s<addDays(base,-60)) s=(y+1)+s.slice(4); dates.push(s); }
  t=t.replace(reD,' ');

  const reN=/\b(?:el|dia)\s+(\d{1,2})\b/g;

  const recover=/recuper|devuel|devolv|compens|lo cambiamos despues|nos arreglamos|despues lo/.test(t);
  // personas
  const ms=findMentions(t);
  let tpl=''; let pos=0; ms.forEach((mm,k)=>{ tpl+=t.slice(pos,mm.s)+'@'+k; pos=mm.e; }); tpl+=t.slice(pos);
  let out=null, inn=null, swap=false; const S_='S';
  const rules=[
    [new RegExp('@(\\d+)\\s+(?:se\\s+)?cambia(?:n)?\\s+(?:el\\s+turno\\s+)?(?:por|con)\\s+@(\\d+)'),g=>[g[1],g[2]]],

    [new RegExp('@(\\d+)\\s+me\\s+(?:cubre|reemplaza|cubriria|cubrira|cambia|hace\\s+el\\s+turno)'),g=>[S_,g[1]]],
    [new RegExp('me\\s+(?:cubre|reemplaza|cubriria|cubrira)\\s+@(\\d+)'),g=>[S_,g[1]]],
    [new RegExp('(?:cubro|reemplazo|cubrire|cubriria)\\s+(?:a\\s+)?@(\\d+)'),g=>[g[1],S_]],
    [new RegExp('(?:voy|ire|vengo)\\s+(?:yo\\s+)?(?:por|en\\s+lugar\\s+de|en\\s+vez\\s+de)\\s+@(\\d+)'),g=>[g[1],S_]],

    [new RegExp('@(\\d+)\\s+no\\s+(?:va|viene|puede|ira|asiste|trabaja|podra|llega)[^@]*?'+VIN+'\\s+@(\\d+)'),g=>[g[1],g[2]]],
    [new RegExp('@(\\d+)\\s+no\\s+(?:va|viene|puede|ira|asiste|trabaja|podra|llega)[^@]*?(?:por|en\\s+su\\s+lugar)\\s+@(\\d+)'),g=>[g[1],g[2]]],

    [new RegExp(NOGO+'[^@]*?(?:por|con|en\\s+mi\\s+lugar)\\s+@(\\d+)'),g=>[S_,g[1]]],
    [new RegExp('@(\\d+)\\s+(?:no\\s+(?:va|viene|puede|ira|asiste|trabaja|podra|llega)|falta|se\\s+ausenta|esta\\s+enferma|tiene\\s+licencia)'),g=>[g[1],'VAC']],

  for(const [re,fn] of rules){ const g=tpl.match(re); if(g){ const r=fn(g); if(r){ [out,inn]=r; break; } } }

    else if(ms.length===1&&unk){ O.id=ms[0].pick; I.id=null; unkDone=true; warns.push('No encontré a "'+unk+'" en la lista de acompañantes. Agregala en Ajustes o elegí a mano quién va.'); }
    else if(ms.length===1&&sender&&ms[0].pick!==sender&&/\bva\b|cubre|por/.test(tpl)){ O.id=sender; I.id=ms[0].pick; warns.push('Revisá quién sale y quién entra.'); }

function slotsOf(pid,date){ const r=[]; if(!pid||!date) return r; const d=S.days[date]; if(!d) return r; for(const f of FR)(d[f]||[]).forEach((sl,i)=>{ if(who(sl)===pid||sl.p===pid) r.push({f,i}); }); return r; }

/* ============================== servidor ============================== */
const LSR='turnosAC_pedidos_v1';
let REQS=readJSON(LSR,[]); let SENDKEY='';
const srvRaw = () => { const c=readJSON(LSG,{}); if(!c.api&&CONFIG.API_URL) c.api=CONFIG.API_URL; return c; };
function srvCfg(){ const c=srvRaw(); return c.api&&c.admin?c:null; }
const pageUrl = () => (S.settings&&S.settings.pageUrl) || (location.protocol==='https:'?(location.origin+location.pathname).replace(/index\.html$/,''):'');
const acLink = p => { const u=pageUrl(); return u&&p.token? u.replace(/index\.html$/,'').replace(/\/?$/,'/')+'?u='+p.token : ''; };
async function api(apiUrl,action,payload){
  let r;
  try{ r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload}),redirect:'follow'}); }
  catch(e){ throw new Error('No hay conexión con el servidor'); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('El servidor no respondió bien (¿la dirección es la correcta?)'); }
  if(!j.ok&&!j.conflict) throw new Error(j.error||'Error del servidor');
  return j;
}
function setMeta(o){ Object.assign(META,o); writeJSON(LSM,META); renderSync(); }
function setReqs(list){ REQS=list||[]; writeJSON(LSR,REQS); }
async function pull(auto){
  const c=srvCfg(); if(!c){ if(!auto) toast('Primero conectá el servidor en Ajustes'); return false; }
  try{
    const r=await api(c.api,'adminGet',{admin:c.admin});
    setReqs(r.requests); setTimes(r.times); SENDKEY=r.sendKey||'';
    const remoteEmpty=!r.data||!r.data.people||!r.data.people.length;
    if(remoteEmpty){ setMeta({rev:r.rev,lastSync:Date.now()}); if(!auto) toast('El servidor todavía no tiene datos: tocá “Subir al servidor”'); render(); return true; }
    if(r.rev===META.rev){ setMeta({lastSync:Date.now()}); if(!auto) toast('Ya estaba al día'); render(); return true; }
    if(META.dirty&&auto&&S.people.length){ setMeta({conflict:true}); render(); return false; }
    if(META.dirty&&!auto&&!confirm('Hay cambios en este dispositivo que no se subieron. Si traés los del servidor, se pierden. ¿Seguir?')) return false;
    S=fixState(r.data); invalidate(); writeJSON(LS,S); setMeta({dirty:false,rev:r.rev,lastSync:Date.now(),conflict:false}); render(); if(!auto) toast('Datos traídos del servidor');
    return true;
  }catch(e){ if(!auto) toast(e.message); else console.warn(e); return false; }
}
let pushing=false;
async function push(force){
  const c=srvCfg(); if(!c){ toast('Primero conectá el servidor en Ajustes'); return false; }
  if(pushing) return false; pushing=true; clearTimeout(autoT);
  try{
    ensureTokens();
    const r=await api(c.api,'adminSave',{admin:c.admin,data:S,rev:META.rev,force:!!force});
    if(r.conflict){ setMeta({conflict:true}); render(); toast('Otro dispositivo guardó cambios antes'); return false; }
    S.rev=r.rev; writeJSON(LS,S); setMeta({dirty:false,rev:r.rev,lastSync:Date.now(),conflict:false}); toast('Guardado en el servidor ✓'); return true;
  }catch(e){ toast(e.message); return false; }
  finally{ pushing=false; }
}
let autoT=null;
function scheduleAutoPush(){ const c=srvCfg(); if(!c||c.auto===false||META.conflict) return; clearTimeout(autoT); autoT=setTimeout(()=>push(false),2500); }
function conflictBanner(){
  return `<div class="banner"><b>Hay dos versiones distintas.</b> Mientras usabas este dispositivo, otro guardó cambios en el servidor. Elegí cuál querés conservar:
  <div class="row" style="margin-top:6px"><button class="b" data-act="cfpull">Usar la del servidor (pierdo lo de acá)</button><button class="b p" data-act="cfpush">Usar la de este dispositivo</button></div></div>`;
}
function ensureTokens(){ for(const p of S.people) if(!p.token) p.token=rndKey(16); }
function rndKey(n){ const c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a,x=>c[x%c.length]).join(''); }
const waLink = (phone,text) => 'https://wa.me/'+String(phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(text);
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copiado'); }catch(e){ prompt('Copiá este texto:',t); } }

async function resolveReq(id,estado){

      save(); const ok=await push(false); if(!ok){ toast('No se pudo guardar en el servidor; el pedido sigue pendiente'); render(); return; }

  render();
}

const LST='turnosAC_horarios_v1';
let TIMES=readJSON(LST,[]);
function setTimes(list){ TIMES=list||[]; writeJSON(LST,TIMES); }
const timeMap = () => { const m=new Map(); for(const t of TIMES) m.set(t.clave,t); return m; };
const hhmm = h => p2(Math.floor(((h%24)+24)%24))+':'+p2(Math.round((h%1)*60));
function hoursBetween(a,b){ const m=s=>{ const x=String(s||'').match(/^(\d{1,2}):(\d{2})$/); return x?(+x[1])*60+(+x[2]):null; }; const A=m(a),B=m(b); if(A==null||B==null) return null; let d=B-A; if(d<=0) d+=1440; return Math.round(d/60*100)/100; }
function declaredByPid(key){ const r={}; for(const t of TIMES) if(String(t.fecha).startsWith(key)){ r[t.pid]=(r[t.pid]||0)+(+t.horas||0); } return r; }
function viewPla(){

    return `<tr><td>${esc(pname(pid))}</td><td class="n">${g.plan}</td><td class="n">${g.n?g.decl:'—'}</td><td class="n ${g.n&&d?'bad':''}">${g.n?(d>0?'+':'')+d:''}</td><td class="n">${g.falta||''}</td></tr>`; }).join('');
  return `${monthNav()}

async function saveTimeAdmin(k,extra={}){
  const c=srvCfg(); if(!c){ toast('Conectá el servidor en Ajustes'); return; }
  const [date,f,i,pid]=k.split('|'); const tm=timeMap().get(k); const ed=ui.plaEd[k]||{};
  const entrada=ed.in??(tm&&tm.entrada), salida=ed.out??(tm&&tm.salida);
  if(!entrada||!salida) return;
  const hh=hoursBetween(entrada,salida); if(hh>16){ toast('Da '+hh+' horas: revisá la hora de entrada y de salida'); return; }
  const revisado=extra.revisado!==undefined?extra.revisado:!!(tm&&tm.revisado);
  try{
    const r=await api(c.api,'adminTime',{admin:c.admin,date,f,i:+i,pid,entrada,salida,text:ed.text??(tm?tm.comentario:''),revisado});
    const row={clave:k,pid,nombre:pname(pid),fecha:date,franja:f,puesto:+i,entrada,salida,horas:r.horas,comentario:ed.text??(tm?tm.comentario:''),cargado_por:'Coordinación',revisado:revisado?'sí':''};
    setTimes(TIMES.filter(x=>x.clave!==k).concat([row])); delete ui.plaEd[k]; toast('Horario guardado: '+r.horas+' hs'); render();
  }catch(e){ toast(e.message); }
}

    case 'emode': ui.edit.mode=D.m; renderModal(); break;
    case 'esel': ui.edit.sel=ui.edit.sel===D.id&&ui.edit.mode==='plan'?null:D.id; renderModal(); break;
    case 'edit-clear': { const e2=ui.edit; const sl=slotAt(e2.date,e2.f,e2.i,true); Object.assign(sl,{p:null,r:null,adj:0,rec:'',note:''}); ui.edit=null; save(); renderModal(); render(); break; }
    case 'edit-save': saveEdit(); break;
    case 'copyweek': copyWeek(); break;
    case 'setbase': setBase(); break;
    case 'basetoggle': S.base.on=S.base.on===false; save(); render(); break;
    case 'clearmonth': clearMonth(); break;
    case 'mparse': { ui.msg.text=document.getElementById('mtext').value; const lines=ui.msg.text.split(/\n+|[.;]\s+/).map(s=>s.trim()).filter(s=>s.length>3);
      const props=[];
      for(const l of lines){ const r=parseLine(l,ui.msg.sender||null); if(r.some(p=>p.out||p.inn&&p.inn!=='VAC')){ props.push(...r); } else if(r[0].date||r[0].f||/recuper|devuel/.test(norm(l))){ const last=props[props.length-1]; if(last){ if(!last.date&&r[0].date) last.date=r[0].date; if(!last.f&&r[0].f) last.f=r[0].f; if(/recuper|devuel|devolv/.test(norm(l))) last.recover=true; } } }
      if(!props.length){ props.push(...parseLine(ui.msg.text.replace(/\n/g,' '),ui.msg.sender||null)); }
      props.forEach(p=>{ if(p.date&&!p.f&&p.out){ const s=slotsOf(p.out,p.date); if(s.length) p.f=s[0].f; } p.warns=p.warns.filter(w=>!(w.startsWith('No encontré la fecha')&&p.date)); });
      ui.msg.props=props; render(); break; }
    case 'mclear': ui.msg={sender:ui.msg.sender,text:'',props:[]}; render(); break;
    case 'pdel': ui.msg.props=ui.msg.props.filter(p=>p.id!==D.id); render(); break;
    case 'papply': { const p=ui.msg.props.find(x=>x.id===D.id); if(p&&applyProp(p)){ save(); render(); toast('Calendario actualizado'); } break; }
    case 'papplyall': { let n=0; for(const p of ui.msg.props) if(!p.done&&applyProp(p)) n++; save(); render(); toast(n+' cambios aplicados'); break; }
    case 'rmode': ui.resMode=D.m; render(); break;
    case 'csv': exportCSV(); break;
    case 'cassign': { const sl=slotAt(D.date,D.f,+D.i,true); if(sl.p&&sl.r==='VAC') applyChange(D.date,D.f,+D.i,D.id,{src:'manual'}); else { sl.p=D.id; sl.r=null; } save(); render(); toast(pname(D.id)+' asignada'); break; }
    case 'autofill': autofill(); break;
    case 'autocancel': ui.autoProp=null; render(); break;
    case 'autoapply': { const ap=ui.autoProp; for(const r of ap.res){ const sl=slotAt(r.date,r.f,r.i,true); if(!who(sl)){ if(sl.r==='VAC'&&sl.p) applyChange(r.date,r.f,r.i,r.pid,{src:'manual'}); else { sl.p=r.pid; sl.r=null; } } } ui.autoProp=null; save(); render(); toast('Propuesta aplicada'); break; }
    case 'tgl': { ensureAvail(ui.month); const arr=S.avail[ui.month][D.id]; const d=+D.d; const s=arr[d]||''; arr[d]=s.includes(D.f)?s.replace(D.f,''):FR.filter(x=>s.includes(x)||x===D.f).join(''); save(); render(); reopen(D.id); break; }
    case 'pall': case 'pnone': { ensureAvail(ui.month); S.avail[ui.month][D.id]=Array(7).fill(a==='pall'?'MTCN':''); save(); render(); reopen(D.id); break; }
    case 'avprev': { const prev=shiftMonth(ui.month,-1); const o={}; for(const p of S.people) o[p.id]=getAvail(prev,p.id).slice(); S.avail[ui.month]=o; save(); render(); toast('Copiada de '+monthLabel(prev)); break; }
    case 'avnext': { ensureAvail(ui.month); let k=shiftMonth(ui.month,1); while(k.slice(0,4)===ui.month.slice(0,4)){ S.avail[k]=clone(S.avail[ui.month]); k=shiftMonth(k,1); } save(); toast('Aplicada hasta diciembre'); break; }
    case 'exadd': { const pid=document.getElementById('exp').value, f=document.getElementById('exf').value, t=document.getElementById('ext').value, n=document.getElementById('exn').value; if(!pid||!f||!t){ toast('Completá persona y fechas'); break; } S.exceptions.push({id:uid(),pid,from:f<=t?f:t,to:f<=t?t:f,note:n}); save(); render(); break; }
    case 'exdel': S.exceptions=S.exceptions.filter(x=>x.id!==D.id); save(); render(); break;
    case 'undo': undoLast(); break;
    case 'padd': { const n=document.getElementById('newp').value.trim(); if(!n) break; S.people.push({id:'p'+uid(),name:n,alias:'',max:5,active:true,phone:'',pin:'',token:rndKey(16)}); save(); render(); break; }
    case 'pdelp': { const used=Object.values(S.days).some(d=>FR.some(f=>(d[f]||[]).some(sl=>sl.p===D.id||sl.r===D.id)));
      if(used){ alert('Tiene turnos cargados. Para que no aparezca más, destildá “Activa” (así se conserva el historial).'); break; }
      if(confirm('¿Borrar a '+pname(D.id)+'?')){ S.people=S.people.filter(p=>p.id!==D.id); save(); render(); } break; }
    case 'pgen': { const p=personById(D.id); const a2=new Uint32Array(1); crypto.getRandomValues(a2); p.pin=String(a2[0]%10000).padStart(4,'0'); ensureTokens(); save(); render(); break; }
    case 'pcopy': { const p=personById(D.id); ensureTokens(); const l=acLink(p); if(!l){ toast('Primero completá la dirección de la página'); break; } copyText(l); break; }
    case 'paccess': { const p=personById(D.id); ensureTokens(); const l=acLink(p);
      if(!l){ toast('Primero completá la dirección de la página'); break; } if(!p.pin){ toast('Primero generá su PIN 🎲'); break; } if(!p.phone){ toast('Falta su teléfono'); break; }
      if(META.dirty) push(false);
      window.open(waLink(p.phone,'Hola '+p.name+' 👋 Desde este link vas a poder ver tus turnos, confirmarlos y avisar si no podés ir:\n'+l+'\nTu PIN es: '+p.pin+' (no lo compartas).'),'_blank'); break; }
    case 'pedok': resolveReq(D.id,D.e); break;
    case 'plaflt': ui.plaFlt=D.m; render(); break;
    case 'pladayclr': ui.plaDay=''; render(); break;
    case 'plaon': if(confirm('¿Activar la planilla digital? Desde que se guarde, cada AC va a ver en su link una sección para cargar a qué hora entró y salió.')){ S.settings.planilla=true; save(); if(srvCfg()) push(false); render(); } break;
    case 'plaoff': if(confirm('¿Apagar la planilla digital? Lo ya cargado se conserva.')){ S.settings.planilla=false; save(); if(srvCfg()) push(false); render(); } break;
    case 'envcopy': copyText(weekMsg(personById(D.id),ui.envWeek||addDays(mondayOf(today()),7)).text); break;
    case 'copykey': copyText(SENDKEY); break;
    case 'srvsave': { const c={api:document.getElementById('apiurl').value.trim(),admin:document.getElementById('apipass').value,auto:document.getElementById('apiauto').checked};
      writeJSON(LSG,c); renderSync(); const msg=document.getElementById('srvmsg'); msg.textContent='Probando…';
      api(c.api,'adminGet',{admin:c.admin}).then(r=>{ setReqs(r.requests); setTimes(r.times); SENDKEY=r.sendKey||''; const has=r.data&&r.data.people&&r.data.people.length;
        msg.textContent=has?'Conexión OK. El servidor ya tiene datos: tocá “Traer del servidor” para usarlos acá (o “Subir” para reemplazarlos con los de este dispositivo).':'Conexión OK. El servidor está vacío: tocá “Subir al servidor”.';
        if(!has) setMeta({rev:r.rev}); }).catch(err=>{ msg.textContent='No funcionó: '+err.message; });
      break; }
    case 'srvpull': pull(false); break;
    case 'srvpush': push(true); break;
    case 'srvpass': { const c=srvCfg(); const n=document.getElementById('newpass').value; if(!c) break;
      api(c.api,'adminPass',{admin:c.admin,nueva:n}).then(()=>{ c.admin=n; writeJSON(LSG,c); toast('Clave cambiada. Actualizala en tus otros dispositivos.'); render(); }).catch(err=>toast(err.message)); break; }
    case 'cfpull': setMeta({dirty:false,conflict:false,rev:-1}); pull(false); break;
    case 'cfpush': setMeta({conflict:false}); push(true); break;
    case 'sync-click': { const c=srvCfg(); if(!c){ ui.tab='aju'; render(); } else if(META.conflict){ ui.tab='mes'; render(); } else if(META.dirty) push(false); else pull(false); break; }
    case 'export': download('turnos_AC_'+today()+'.json',JSON.stringify(S,null,1),'application/json'); break;
    case 'reset': if(confirm('¿Borrar todos los datos de ESTE dispositivo? (Lo que esté en el servidor no se toca)')){ S=emptyState(); setMeta({dirty:false,rev:null,conflict:false}); save(false); render(); } break;
  }
});
function acClick(a,D){
  switch(a){
    case 'aclogin': { const pin=(document.getElementById('acpin').value||'').trim(); if(!/^\d{4}$/.test(pin)){ AC.err='El PIN son 4 números'; acRender(); return; }
      AC.pin=pin; if(document.getElementById('acrem').checked) writeJSON('turnosAC_pin_'+AC.token,pin); acLoad(); break; }
    case 'aclogout': try{ localStorage.removeItem('turnosAC_pin_'+AC.token); }catch(e){} AC.pin=''; AC.data=null; acRender(); break;
    case 'acreload': acLoad(); break;
    case 'acconf': { const [date,f,i]=D.k.split('|'); acSend({tipo:'confirmar',date,f,i:+i},'¡Gracias! Turno confirmado'); break; }
    case 'acconfweek': (async()=>{ const D2=AC.data; const reqs=D2.requests||[]; const m=D.m; AC.busy=true; acRender(); let n=0;
      for(const s of D2.shifts.filter(s=>s.mine&&s.date>=D2.today&&mondayOf(s.date)===m)){ if(reqs.some(r=>r.fecha===s.date&&r.franja===s.f&&String(r.puesto)===String(s.i))) continue;
        try{ await api(acApi(),'acRequest',{u:AC.token,pin:AC.pin,tipo:'confirmar',date:s.date,f:s.f,i:s.i}); n++; }catch(e){ toast(e.message); break; } }
      AC.data=await api(acApi(),'acGet',{u:AC.token,pin:AC.pin}).catch(()=>AC.data); AC.busy=false; acRender(); toast(n+' turnos confirmados'); })(); break;
    case 'acno': AC.form=D.k; acRender(); break;
    case 'acnocancel': AC.form=null; acRender(); break;
    case 'acnosend': { const [date,f,i]=D.k.split('|'); acSend({tipo:'no_puedo',date,f,i:+i,cover:document.getElementById('accover').value,text:document.getElementById('actext').value},'Pedido enviado. Te avisamos cuando se resuelva.'); break; }
    case 'actime': { const [date,f,i]=D.k.split('|'); const g=id=>document.getElementById(id+'_'+D.k).value;
      const ein=g('ti'), eout=g('to'), etxt=g('tc'); if(!ein||!eout){ toast('Completá la hora de entrada y de salida'); return; } const hh=hoursBetween(ein,eout); if(hh>16){ toast('Da '+hh+' horas: revisá la hora de entrada y de salida'); return; }
      (async()=>{ AC.busy=true; acRender(); try{ const r=await api(acApi(),'acTime',{u:AC.token,pin:AC.pin,date,f,i:+i,entrada:ein,salida:eout,text:etxt}); toast('Guardado: '+r.horas+' hs'); AC.data=await api(acApi(),'acGet',{u:AC.token,pin:AC.pin}); }catch(e){ toast(e.message); } AC.busy=false; acRender(); })(); break; }
    case 'acsugsend': { const t=document.getElementById('acsug').value.trim(); if(!t){ toast('Escribí tu sugerencia'); return; } AC.sug=''; acSend({tipo:'sugerencia',text:t},'Sugerencia enviada'); break; }
  }
}
function reopen(pid){ const btn=document.querySelector(`[data-act="tgl"][data-id="${pid}"]`); if(btn) btn.closest('details').open=true; }
document.addEventListener('change',e=>{
  if(AC) return;
  const el=e.target; const D=el.dataset;
  if(el.closest('.prop')&&D.pchg){ const id=el.closest('.prop').dataset.pid; const p=ui.msg.props.find(x=>x.id===id); if(!p) return;
    const v=el.value; if(D.pchg==='recover') p.recover=!!v; else p[D.pchg]=v||null;
    if(D.pchg==='date'||D.pchg==='out'){ if(p.out&&p.date){ const s=slotsOf(p.out,p.date); if(s.length&&!s.some(x=>x.f===p.f)) p.f=s[0].f; } }
    p.warns=p.warns.filter(w=>!/Elegí arriba|No encontré la fecha|más de un turno/.test(w));
    document.getElementById('props').outerHTML=document.createRange().createContextualFragment(viewMsj()).querySelector('#props').outerHTML; return; }
  const c=D.chg; if(!c) return;
  const P=()=>personById(D.id);
  switch(c){
    case 'msel': ui.month=ui.month.slice(0,4)+'-'+el.value; render(); break;
    case 'ysel': ui.month=el.value+ui.month.slice(4); render(); break;
    case 'eadj': ui.edit.adj=+el.value||0; break;
    case 'erec': ui.edit.rec=el.value; break;
    case 'enote': ui.edit.note=el.value; break;
    case 'msender': ui.msg.sender=el.value; ui.msg.text=document.getElementById('mtext').value; break;
    case 'sheet': { const k=ui.month; S.sheetHours[k]=S.sheetHours[k]||{}; if(el.value==='') delete S.sheetHours[k][D.id]; else S.sheetHours[k][D.id]=+el.value; save(); render(); break; }
    case 'pmax': P().max=Math.max(1,Math.min(7,+el.value||5)); save(); break;
    case 'pname': if(el.value.trim()){ P().name=el.value.trim(); save(); } break;
    case 'palias': P().alias=el.value; save(); break;
    case 'pphone': P().phone=el.value.replace(/[^\d]/g,''); save(); break;
    case 'ppin': { const v=el.value.replace(/\D/g,''); if(v&&v.length!==4){ toast('El PIN tiene que tener 4 números'); break; } P().pin=v; ensureTokens(); save(); break; }
    case 'pact': P().active=el.checked; save(); break;
    case 'pageurl': S.settings.pageUrl=el.value.trim(); save(); break;
    case 'tname': S.types[D.f].name=el.value||S.types[D.f].name; save(); break;
    case 'tstart': S.types[D.f].start=Math.max(0,Math.min(23,+el.value||0)); save(); break;
    case 'thours': S.types[D.f].hours=Math.max(1,Math.min(24,+el.value||1)); save(); break;
    case 'tslots': S.types[D.f].slots=Math.max(1,Math.min(6,+el.value||1)); save(); break;
    case 'pedcover': ui.ped[D.id].cover=el.value; if(el.value==='VAC') ui.ped[D.id].rec=false; render(); break;
    case 'pedrec': ui.ped[D.id].rec=!!el.value; break;
    case 'pedresp': ui.ped[D.id].resp=el.value; break;
    case 'envweek': ui.envWeek=mondayOf(el.value||today()); render(); break;
    case 'planilla': S.settings.planilla=el.checked; save(); break;
    case 'pladay': ui.plaDay=el.value; if(el.value) ui.month=el.value.slice(0,7); render(); break;
    case 'tin': case 'tout': case 'tcom': { const e2=ui.plaEd[D.k]=ui.plaEd[D.k]||{}; e2[{tin:'in',tout:'out',tcom:'text'}[c]]=el.value; saveTimeAdmin(D.k); break; }
    case 'trev': saveTimeAdmin(D.k,{revisado:el.checked}); break;
    case 'import': { const file=el.files[0]; if(!file) break; file.text().then(txt=>{ try{ const d=JSON.parse(txt); if(!d.people||!d.days) throw 0; if(S.people.length&&!confirm('Esto reemplaza los datos de este dispositivo. ¿Seguir?')) return; S=fixState(d); ensureTokens(); save(); ui.tab='mes'; render(); toast('Datos cargados'); }catch(err){ toast('Ese archivo no tiene el formato correcto'); } }); break; }
  }
});
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal'){ ui.edit=null; renderModal(); } });

/* ============================== inicio ============================== */
document.getElementById('org').textContent=CONFIG.ORG;
const QS=new URLSearchParams(location.search);
if(QS.get('u')) acStart(QS.get('u'));
else {
  render();
  (async()=>{
    if(srvCfg()) await pull(true);
    else if(!S.people.length){ try{ const r=await fetch('data.json',{cache:'no-store'}); if(r.ok){ const d=await r.json(); if(d.people&&d.days){ S=fixState(d); ensureTokens(); save(false); render(); } } }catch(e){} }
  })();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&srvCfg()&&!META.dirty) pull(true); });
}
</script>
